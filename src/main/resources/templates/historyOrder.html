<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Order History</h2>

    <form th:action="@{/order/history}" method="post" class="mb-4">
        <div class="form-group">
            <label for="author">Author Name:</label>
            <input type="text" class="form-control" id="author" name="author" placeholder="Enter author name (e.g., Budi)" required>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <table class="table table-striped" th:if="${orders != null}">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Author</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.author}"></td>
            <td th:text="${order.status}"></td>
            <td>
                <a th:href="@{/order/pay/{id}(id=${order.id})}" class="btn btn-success btn-sm">Pay Now</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(orders)}">
            <td colspan="4" class="text-center">No orders found for this author.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
