<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" th:if="${order != null}">
    <h2>Payment for Order</h2>
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title" th:text="'Order ID: ' + ${order.id}"></h5>
            <p class="card-text" th:text="'Author: ' + ${order.author}"></p>
            <p class="card-text" th:text="'Status: ' + ${order.status}"></p>
        </div>
    </div>

    <form th:action="@{/order/pay/{id}(id=${order.id})}" method="post">
        <button type="submit" class="btn btn-primary">Confirm Dummy Payment</button>
        <a th:href="@{/order/history}" class="btn btn-secondary">Back to History</a>
    </form>
</div>
<div class="container mt-5" th:if="${order == null}">
    <div class="alert alert-danger">Order not found.</div>
</div>
</body>
</html>
