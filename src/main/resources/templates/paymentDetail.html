<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Payment Details</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Check Payment Status</h2>
    <div th:if="${payment == null}">
        <p>Please use the correct URL with your Payment ID to view details.</p>
    </div>

    <div class="card" th:if="${payment != null}">
        <div class="card-body">
            <h5 class="card-title">Payment Info</h5>
            <p th:text="'ID: ' + ${payment.id}"></p>
            <p th:text="'Method: ' + ${payment.method}"></p>
            <p class="font-weight-bold" th:text="'Status: ' + ${payment.status}"></p>
        </div>
    </div>
</div>
</body>
</html>
