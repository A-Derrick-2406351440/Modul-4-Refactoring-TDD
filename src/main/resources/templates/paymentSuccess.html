<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 text-center">
    <h2 class="text-success">Payment Submitted Successfully!</h2>
    <p th:if="${paymentId != null}" th:text="'Payment ID / Order ID processed: ' + ${paymentId}"></p>
    <a th:href="@{/order/history}" class="btn btn-primary mt-3">Back to Order History</a>
</div>
</body>
</html>
