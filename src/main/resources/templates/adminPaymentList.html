<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Payment List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>All Payments (Admin)</h2>
    <table class="table table-bordered">
        <thead class="thead-dark">
        <tr>
            <th>Payment ID</th>
            <th>Method</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="payment : ${payments}">
            <td th:text="${payment.id}"></td>
            <td th:text="${payment.method}"></td>
            <td>
                <span class="badge"
                      th:classappend="${payment.status == 'SUCCESS'} ? 'badge-success' : (${payment.status == 'REJECTED'} ? 'badge-danger' : 'badge-warning')"
                      th:text="${payment.status}"></span>
            </td>
            <td>
                <a th:href="@{/payment/admin/detail/{id}(id=${payment.id})}" class="btn btn-info btn-sm">View Details</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="4" class="text-center">No payments available.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
