<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Payment Details</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" th:if="${payment != null}">
    <h2>Payment Details</h2>
    <ul class="list-group mb-4">
        <li class="list-group-item"><strong th:text="'Payment ID: '"></strong> <span th:text="${payment.id}"></span></li>
        <li class="list-group-item"><strong th:text="'Method: '"></strong> <span th:text="${payment.method}"></span></li>
        <li class="list-group-item"><strong th:text="'Status: '"></strong> <span th:text="${payment.status}"></span></li>
        <li class="list-group-item" th:if="${payment.order != null}"><strong th:text="'Linked Order ID: '"></strong> <span th:text="${payment.order.id}"></span></li>
    </ul>

    <a th:href="@{/payment/admin/list}" class="btn btn-secondary">Back to List</a>
</div>
<div class="container mt-5" th:if="${payment == null}">
    <div class="alert alert-warning">Payment not found.</div>
</div>
</body>
</html>
